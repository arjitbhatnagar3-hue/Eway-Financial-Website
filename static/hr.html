<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Portal — EWAY Financial Consultancy</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23181B20'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='bold' fill='%23EDEFF2' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/hr.css" />
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot-mark">E</div>
    <p>Loading HR Portal…</p>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="HR Portal navigation">
      <a href="/hr" class="sb-brand" data-link>
        <span class="sb-mark">E</span>
        <span class="sb-brand-text">
          <strong>EWAY</strong>
          <small>HR Portal</small>
        </span>
      </a>
      <nav class="sb-nav" id="sbNav"></nav>
      <div class="sb-foot">
        <a href="/" class="sb-foot-link">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to website
        </a>
      </div>
    </aside>
    <div class="sb-scrim" id="sbScrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">
          <p class="crumb" id="crumb">HR Portal</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-user" id="topUser"></div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modalTitle">
    <form method="dialog" class="modal-inner" id="modalForm" novalidate>
      <header class="modal-head">
        <h2 id="modalTitle">Dialog</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <div class="form-error" id="modalError" hidden></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/hr.js"></script>
</body>
</html>
