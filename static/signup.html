<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an account — EWAY Financial Consultancy Pvt. Ltd.</title>
  <meta name="description" content="Create your EWAY Financial Consultancy account." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317130F'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='bold' fill='%23EDEFF2' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header scrolled">
    <div class="container nav-wrap">
      <a href="/" class="brand" aria-label="EWAY Financial Consultancy — home">
        <span class="brand-word">EWAY</span>
        <span class="brand-sub">Financial Consultancy</span>
      </a>
      <nav class="main-nav auth-nav" aria-label="Account">
        <a href="/login">Log in</a>
        <a href="/signup" class="btn-pill btn-pill-sm">Sign up</a>
      </nav>
    </div>
  </header>

  <main id="main" class="auth-main">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Join EWAY Financial — it takes less than a minute.</p>

      <div class="auth-error" id="authError" hidden></div>

      <form id="authForm" data-mode="signup" novalidate>
        <div class="form-field">
          <label for="sfName">Full Name</label>
          <input type="text" id="sfName" name="name" placeholder="Your full name" autocomplete="name" required minlength="2" maxlength="120" />
        </div>
        <div class="form-field">
          <label for="sfEmail">Email Address</label>
          <input type="email" id="sfEmail" name="email" placeholder="you@example.com" autocomplete="email" required maxlength="200" />
        </div>
        <div class="form-field">
          <label for="sfPassword">Password</label>
          <input type="password" id="sfPassword" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" maxlength="128" />
        </div>
        <div class="form-field">
          <label for="sfConfirm">Confirm Password</label>
          <input type="password" id="sfConfirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" required minlength="8" maxlength="128" />
        </div>
        <button type="submit" class="btn-pill">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>

  <script src="/static/js/auth.js"></script>
</body>
</html>
