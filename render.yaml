# Paid Render Blueprint. Provisioned services stay in Singapore and the
# database accepts connections only from private services in this project.
services:
  - type: web
    name: eway-financial
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eway-production-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: EWAY Administrator
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: eway-production-db
    region: singapore
    plan: 0.5c-1g
    databaseName: eway
    user: eway_app
    postgresMajorVersion: "17"
    diskSizeGB: 15
    ipAllowList: []
