# Render Blueprint — one-click deploy from GitHub.
# On render.com: New + → Blueprint → pick this repo → Deploy.
services:
  - type: web
    name: eway-financial
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
